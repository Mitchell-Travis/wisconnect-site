name: WisConnect checks

on:
  pull_request:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "27 9 * * 1"

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check known dependency vulnerabilities
        run: npm audit --audit-level=moderate
      - name: Build public Pages export
        run: npm run build
      - run: npm run typecheck
      - name: Build local account-enabled export
        env:
          NEXT_PUBLIC_LAN_ORIGIN: http://192.168.100.16:3001
        run: GITHUB_ACTIONS=false npm run build

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: wisconnect_ci
          POSTGRES_USER: wisconnect_ci
          POSTGRES_PASSWORD: disposable-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wisconnect_ci -d wisconnect_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
      mailpit:
        image: axllent/mailpit:v1.29
        ports:
          - 1025:1025
          - 8025:8025
    env:
      DATABASE_URL: postgresql+psycopg://wisconnect_ci:disposable-ci-only@127.0.0.1:5432/wisconnect_ci
      WISCONNECT_CONTACT_MAIL_MODE: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install locked runtime
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r backend/requirements.lock
          .venv/bin/python -m pip check
      - name: Check direct requirements match the lock
        run: |
          .venv/bin/python -m pip install --dry-run --no-deps -r backend/requirements.txt --report requirements-report.json
          .venv/bin/python -c 'import json; assert not json.load(open("requirements-report.json"))["install"], "Direct requirements changed: regenerate backend/requirements.lock"'
      - name: Audit locked backend dependencies
        run: |
          python -m venv .audit-venv
          .audit-venv/bin/python -m pip install pip-audit==2.10.1
          .audit-venv/bin/pip-audit --require-hashes --disable-pip -r backend/requirements.lock
      - name: Wait for local mail capture
        run: curl --fail --silent --show-error --retry 12 --retry-connrefused --retry-delay 2 --max-time 5 http://127.0.0.1:8025/livez
      - name: Migrate disposable CI database
        run: .venv/bin/python -m alembic -c backend/alembic.ini upgrade head
      - name: Check security and admin workflows
        run: .venv/bin/python -m backend.check_all
