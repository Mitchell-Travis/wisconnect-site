<style>
  #wis-color-study { --wis-purple:#563578; --wis-plum:#291833; --wis-mist:#F7F3F8; --wis-ivory:#FAF8F5; --wis-gold:#B9955A; font-family:Arial,sans-serif; color:var(--wis-plum); color-scheme:light; }
  #wis-color-study * { box-sizing:border-box; }
  #wis-color-study .wis-palette { display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:16px; }
  #wis-color-study .wis-swatch { min-height:86px;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;gap:5px;font-size:12px;border:1px solid #29183318;border-radius:6px; }
  #wis-color-study .wis-swatch small { font-size:11px; }
  #wis-color-study .wis-preview { padding:24px; background:var(--wis-mist); border:1px solid #29183318;border-radius:8px; }
  #wis-color-study .wis-toolbar { display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between;margin-bottom:30px; }
  #wis-color-study .wis-label { font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600; }
  #wis-color-study .wis-choices { display:flex;flex-wrap:wrap;gap:6px; }
  #wis-color-study button { font:inherit;font-size:12px;min-height:44px;padding:8px 12px;border:1px solid #56357840;border-radius:5px;background:#FFFFFF;color:var(--wis-purple); }
  #wis-color-study button[aria-pressed="true"] { background:var(--wis-purple);color:#FFFFFF; }
  #wis-color-study h2 { margin:0;text-align:center;font:normal 34px/1.12 Georgia,serif;letter-spacing:-.035em;color:var(--wis-plum); }
  #wis-color-study h2 em { color:var(--wis-purple); }
  #wis-color-study .wis-portraits { display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;max-width:580px;margin:28px auto; }
  #wis-color-study figure { min-width:0;margin:0;background:#FFFFFF;border-radius:10px;overflow:hidden;box-shadow:0 10px 28px #29183312; }
  #wis-color-study img { display:block;width:100%;aspect-ratio:1;object-fit:cover; }
  #wis-color-study figcaption { padding:12px;font:normal 16px/1.2 Georgia,serif; }
  #wis-color-study .wis-footer { display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;font-size:12px; }
  #wis-color-study .wis-gold { width:40px;height:2px;background:var(--wis-gold);display:inline-block;margin-right:10px;vertical-align:middle; }
  #wis-color-study output { font-size:11px;color:var(--wis-purple); }
  @media(max-width:500px) { #wis-color-study .wis-palette{grid-template-columns:repeat(3,minmax(0,1fr));} #wis-color-study .wis-preview{padding:16px;} #wis-color-study .wis-portraits{gap:8px;} #wis-color-study figcaption{padding:8px;font-size:13px;} #wis-color-study h2{font-size:28px;} }
</style>

<script>
(() => {
  const root=document.getElementById('wis-color-study');
  const looks={lavender:['#F7F3F8','Lavender · #F7F3F8'],ivory:['#FAF8F5','Ivory · #FAF8F5'],glow:['radial-gradient(ellipse at 0% 100%, #DCCFE466, transparent 65%), radial-gradient(ellipse at 100% 0%, #B9955A30, transparent 60%), #F7F3F8','Soft lavender + gold glow']};
  const state={look:'lavender'};
  const saved=window.openai?.widgetState?.modelContent?.visionariesBackground;
  if(looks[saved])state.look=saved;
  function render(){const look=looks[state.look]||looks.lavender;root.querySelector('.wis-preview').style.background=look[0];root.querySelector('output').textContent=look[1];root.querySelectorAll('[data-look]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.look===state.look)));}
  root.querySelectorAll('[data-look]').forEach(button=>button.addEventListener('click',()=>{state.look=button.dataset.look;render();window.openai?.setWidgetState({modelContent:{visionariesBackground:state.look},privateContent:null}).catch(()=>{});}));
  window.addEventListener('openai:set_globals',event=>{const look=event.detail?.globals?.widgetState?.modelContent?.visionariesBackground;if(looks[look]){state.look=look;render();}});
  render();
  if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addSelect(state,'look',{label:'Visionaries background',options:[{label:'Quiet lavender',value:'lavender'},{label:'Warm ivory',value:'ivory'},{label:'Lavender and gold glow',value:'glow'}]});}
})();
</script>
