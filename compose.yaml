services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wisconnect
      POSTGRES_USER: wisconnect
      POSTGRES_PASSWORD: wisconnect
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wisconnect -d wisconnect"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
